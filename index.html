<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oficina Musical - Player MP3</title>
    <style>
        body { 
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif; 
            display: flex; justify-content: center; align-items: center; 
            min-height: 100vh; margin: 0; background: #0f0f0f; color: #ffffff; 
        }
        .container { 
            text-align: center; background: #1a1a1a; padding: 30px; 
            border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.8); 
            width: 90%; max-width: 350px; border: 1px solid #333;
        }
        h2 { color: #4CAF50; margin-bottom: 20px; }
        .playlist { list-style: none; padding: 0; margin-top: 20px; text-align: left; }
        .playlist li { 
            padding: 14px; border-bottom: 1px solid #333; cursor: pointer; 
            display: flex; align-items: center; font-size: 0.95rem;
            transition: 0.2s;
            -webkit-tap-highlight-color: transparent;
        }
        .playlist li:hover { background: #252525; }
        .playlist li.active { color: #4CAF50; font-weight: bold; background: #222; }
        .playlist li::before { content: "▶"; margin-right: 12px; font-size: 0.7rem; }
        
        audio { width: 100%; margin-top: 20px; }
        
        /* Bloqueio visual do botão de download (Chrome/Edge/Android) */
        audio::-webkit-media-controls-enclosure { overflow: hidden; }
        audio::-webkit-media-controls-panel { width: calc(100% + 30px); }
    </style>
</head>
<body>

<div class="container">
    <h2>🎵 Oficina Musical</h2>
    <p id="now-playing" style="font-size: 0.85rem; color: #888;">Selecione uma música</p>
    
    <audio id="audio" controls playsinline controlsList="nodownload" oncontextmenu="return false;"></audio>

    <ul class="playlist">
        <li onclick="playSong('Oficina1.mp3', 'Oficina 1', this)">Oficina 1</li>
        <li onclick="playSong('Oficina2.mp3', 'Oficina 2', this)">Oficina 2</li>
        <li onclick="playSong('Oficina3.mp3', 'Oficina 3', this)">Oficina 3</li>
        <li onclick="playSong('Oficina4.mp3', 'Oficina 4', this)">Oficina 4</li>
        <li onclick="playSong('Oficina5.mp3', 'Oficina 5', this)">Oficina 5</li>
    </ul>
</div>

<script>
    const audio = document.getElementById('audio');
    const nowPlayingText = document.getElementById('now-playing');

    function playSong(mp3File, title, element) {
        nowPlayingText.innerText = "Carregando: " + title;
        
        // Destacar música atual na lista
        document.querySelectorAll('.playlist li').forEach(item => item.classList.remove('active'));
        element.classList.add('active');

        // Troca a fonte do áudio
        audio.src = mp3File;
        audio.load(); // Necessário para garantir a troca no iOS

        // Tenta tocar
        audio.play()
            .then(() => {
                nowPlayingText.innerText = "Tocando: " + title;
            })
            .catch(error => {
                nowPlayingText.innerText = "Clique no Play para ouvir: " + title;
                console.log("Autoplay bloqueado, aguardando clique.");
            });
    }

    // Opcional: Tenta carregar a primeira música ao abrir a página
    window.onload = () => {
        const first = document.querySelector('.playlist li');
        if (first) {
            // Apenas prepara a primeira música sem forçar o som (para não ser barrado pelo iOS)
            audio.src = 'Oficina1.mp3';
            first.classList.add('active');
            nowPlayingText.innerText = "Oficina 1 pronta";
        }
    };
</script>

</body>
</html>
